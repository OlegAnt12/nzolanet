<div class="contentor">
  <div class="cabeca-feed">
    <div class="navegador">
      <div class="sup-dir">
        <div class="logotipo" routerLink="/feed">NzolaNet</div>
        <div class="caixa-pesquisa">
          <button type="button" class="btn btn-pesquisa" (click)="irParaPesquisa()">Pesquisar</button>
        </div>
      </div>
      <div class="sup-esq">
        <button type="button" class="btn btn-home-feed" routerLink="/feed">Feed</button>
        <button type="button" class="btn btn-perfil" routerLink="/feed/perfil">Perfil</button>
        <button type="button" class="btn btn-logout" (click)="executarLogout()">Sair</button>
      </div>
    </div>
  </div>

  <div class="home-feed">
    <div class="seccao-utilizador" *ngIf="utilizadorLogado">
      <app-mini-perfil
        [utilizadorLogado]="utilizadorLogado"
        [estatisticas]="estatisticaUtilizador"
        [modoEdicao]="modoEdicaoPerfil"
        (abrirEdicao)="modoEdicaoPerfil = true"
        (salvarPerfil)="onSalvarPerfil($event)"
        (cancelarEdicao)="modoEdicaoPerfil = false"
        (fotoSelecionada)="onFotoPerfilSelecionada($event)">
      </app-mini-perfil>

      <div class="publicacao-form">
        <form [formGroup]="publicacaoForm" (ngSubmit)="fazerPublicacao()">
          <textarea formControlName="texto" placeholder="O que estás a pensar?" rows="3"></textarea>
          <div>
            <label>
              Anexar Ficheiros
              <input type="file" multiple accept="image/*,video/*" (change)="aoAdicionarImagensDoFeed($event)" />
            </label>
            <span *ngIf="ficheirosSelecionados.length">({{ ficheirosSelecionados.length }})</span>
            <button type="submit" [disabled]="publicacaoForm.invalid || enviarPost">
              {{ enviarPost ? 'A publicar...' : 'Publicar' }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="seccao-publicacao">
      <main class="area-feed">
        <div *ngIf="carregandoFeed" class="loading-state">A carregar o feed...</div>

        <app-publicacao
          *ngFor="let pub of feedPublicacoes"
          [publicacao]="pub"
          [utilizadorLogadoId]="utilizadorLogado?.id"
          [seguindoAutores]="seguindoAutores"
          (baze)="onBaze($event)"
          (comentar)="onComentar($event)"
          (enviarComentario)="onEnviarComentario($event)"
          (alternarSeguir)="onAlternarSeguir($event)"
          (denunciar)="onDenunciar($event)"
          (editar)="onEditarPublicacao($event)"
          (salvarEdicao)="onSalvarEdicao($event)"
          (eliminar)="onEliminarPublicacao($event)">
        </app-publicacao>

        <div *ngIf="!carregandoFeed && !feedPublicacoes.length">
          <p>Ainda não há publicações. Dá o primeiro baze!</p>
        </div>
      </main>
    </div>

    <div class="seccao-notificacao">
      <app-lista-notificacoes [notificacoes]="listaNotificacoes"></app-lista-notificacoes>
    </div>
  </div>
</div>
