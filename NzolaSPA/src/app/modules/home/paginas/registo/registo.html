<div class="componente-registo">
  <form action="" class="formulario-registo">
    <div class="campo-dados">
      <input type="text" name="nome_completo" id="nomeCompletoId" class="txt txt-nome-completo" />
    </div>
    <div class="campo-dados">
      <input
        type="text"
        name="nome_utilizador"
        id="nomeUtilizadorId"
        class="txt txt-nome-utilizador"
      />
    </div>
    <div class="campo-dados">
      <input type="text" name="email" id="emailId" class="txt txt-email" />
    </div>
    <div class="campo-dados">
      <input type="text" name="palavra_passe" id="palavraPasseIdX" class="txt txt-palavra-passe" />
    </div>
    <div class="campo-dados">
      <input
        type="checkbox"
        name="palavra_passe"
        id="palavraPasseIdX"
        class="txt txt-palavra-passe"
      />
      <label for="palavra_passe">Concordo com os termos da Nzolanet</label>
    </div>
    <button type="submit" class="btn btn-registar">Registo</button>
    <hr />
    <p routerLink="/home/login"><span> Já tem uma conta? </span></p>
  </form>
</div>
