<div class="contentor-esqueci-password">
  <div class="cartao-esqueci-password">
    <h1 class="titulo">Esqueci a palavra-passe</h1>
    <p class="descricao">Introduz o teu e-mail e enviaremos um link para redefinires a tua palavra-passe.</p>

    <ng-container *ngIf="!enviado; else sucessoMsg">
      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="campo-formulario">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailInput="ngModel"
            placeholder="O teu e-mail"
          />
          <span class="erro-campo" *ngIf="emailInput.invalid && emailInput.touched">
            E-mail inválido
          </span>
        </div>

        <p class="erro-geral" *ngIf="erro">{{ erro }}</p>

        <button type="submit" class="btn-submeter" [disabled]="carregando || form.invalid">
          {{ carregando ? 'A enviar...' : 'Enviar link' }}
        </button>
      </form>
    </ng-container>

    <ng-template #sucessoMsg>
      <div class="sucesso-msg">
        <p>Se o e-mail existir, receberás um link de redefinição da palavra-passe.</p>
      </div>
    </ng-template>

    <a routerLink="/home/login" class="link-voltar">Voltar ao login</a>
  </div>
</div>
