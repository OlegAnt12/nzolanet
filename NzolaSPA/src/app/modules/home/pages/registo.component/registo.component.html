<!-- Componente de Registo -->
<div class="componente-registo">
  <form action="" class="formulario-registo" [formGroup]="registoForm" (ngSubmit)="fazerRegisto()">
    <div class="form-group">
      <label for="foto">Foto de Perfil (Opcional)</label>
      <input type="file" id="foto" (change)="aoSelecionarFoto($event)" accept="image/*" class="form-control-file" />
    </div>
    <div class="campo-dados">
      <label for="nomeId">Nome:</label>
      <input type="text" name="nome" id="nomeId" class="txt txt-nome" formControlName="nome" />
    </div>
    <div class="campo-dados">
      <label for="sobrenomeId">Sobrenome:</label>
      <input type="text" name="sobrenome" id="sobrenomeId" class="txt txt-sobrenome" formControlName="sobrenome" />
    </div>
    <div class="campo-dados">
      <label for="nomeUtilizadorId">Nome de Utilizador:</label>
      <input
        type="text"
        name="nome_utilizador"
        id="nomeUtilizadorId"
        class="txt txt-nome-utilizador"
        formControlName="nomeUtilizador"
      />
    </div>
    <div class="campo-dados">
      <label for="emailId">Email:</label>
      <input type="email" name="email" id="emailId" class="txt txt-email" formControlName="email" />
    </div>
    <div class="campo-dados">
      <label for="dataNascimentoId">Data de Nascimento:</label>
      <input type="date" name="data_nascimento" id="dataNascimentoId" class="txt txt-dataNascimento" formControlName="dataNascimento" />
    </div>
    <label for="generoId">Gênero:</label>
    <div class="campo-dados">
      <input type="radio" name="genero" id="masculinoId" class="radio radio-masculino" formControlName="genMasculino" />
      <label for="masculinoId">Masculino:</label>
    </div>
    <div class="campo-dados">
      <input type="radio" name="genero" id="femeninoId" class="radio radio-femenino" formControlName="genFemenino" />
      <label for="fameninoId">Femenino:</label>
    </div>
    <div class="campo-dados">
      <label for="palavraPasseId">Palavra-passe:</label>
      <input type="password" name="palavra_passe" id="palavraPasseId" class="txt txt-palavra-passe" formControlName="palavraPasse" />
    </div>
    <div class="campo-dados">
      <input
        type="checkbox"
        name="termos"
        id="termoId"
        class="txt txt-palavra-passe"
      />
      <label for="termoId">Concordo com os termos da Nzolanet</label>
    </div>
    <button type="submit" class="btn btn-registar" [disabled]="registoForm.invalid || carregar" routerLink="/feed">
      <span *ngIf="!carregar">Registar Conta</span>
        <span *ngIf="carregar">A criar conta...</span>
    </button>
    <hr />
    <p routerLink="/home/login"><span> Já tem uma conta? </span></p>
  </form>
</div>
