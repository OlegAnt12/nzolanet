<div class="contentor-redefinir-password">
  <div class="cartao-redefinir-password">
    <ng-container *ngIf="!tokenInvalido; else semToken">
      <ng-container *ngIf="!redefinido; else sucessoMsg">
        <h1 class="titulo">Redefinir palavra-passe</h1>
        <p class="descricao">Escolhe uma nova palavra-passe para a tua conta.</p>

        <form (ngSubmit)="onSubmit()" #form="ngForm">
          <div class="campo-formulario">
            <label for="novaPalavraPasse">Nova palavra-passe</label>
            <input
              type="password"
              id="novaPalavraPasse"
              name="novaPalavraPasse"
              [(ngModel)]="novaPalavraPasse"
              required
              minlength="6"
              #novaInput="ngModel"
              placeholder="Mínimo 6 caracteres"
            />
            <span class="erro-campo" *ngIf="novaInput.invalid && novaInput.touched">
              Mínimo 6 caracteres
            </span>
          </div>

          <div class="campo-formulario">
            <label for="confirmarPalavraPasse">Confirmar palavra-passe</label>
            <input
              type="password"
              id="confirmarPalavraPasse"
              name="confirmarPalavraPasse"
              [(ngModel)]="confirmarPalavraPasse"
              required
              #confirmarInput="ngModel"
              placeholder="Repete a palavra-passe"
            />
            <span class="erro-campo"
                  *ngIf="confirmarInput.touched && novaPalavraPasse !== confirmarPalavraPasse">
              As palavras-passe não coincidem
            </span>
          </div>

          <p class="erro-geral" *ngIf="erro">{{ erro }}</p>

          <button type="submit" class="btn-submeter"
                  [disabled]="carregando || form.invalid || novaPalavraPasse !== confirmarPalavraPasse">
            {{ carregando ? 'A redefinir...' : 'Redefinir palavra-passe' }}
          </button>
        </form>
      </ng-container>

      <ng-template #sucessoMsg>
        <div class="sucesso-msg">
          <p>Palavra-passe redefinida com sucesso!</p>
          <button type="button" class="btn-ir-login" (click)="irParaLogin()">Ir para o login</button>
        </div>
      </ng-template>
    </ng-container>

    <ng-template #semToken>
      <div class="erro-msg">
        <p>Link inválido ou expirado. Pede um novo link de redefinição.</p>
        <a routerLink="/home/esqueci-password" class="link-voltar">Pedir novo link</a>
      </div>
    </ng-template>
  </div>
</div>
